# =============================================================================
# Makzeo - pipeline CI/CD Azure DevOps
#
#   1. Build         compilation, tests unitaires, couverture JaCoCo, analyse SonarQube
#                    (Quality Gate bloquante), publication des artefacts Maven dans Nexus,
#                    compilation Angular, analyse des dépendances (Trivy), contrôle des manifestes
#   2. Images        6 images Docker construites à partir des artefacts testés,
#                    analyse de vulnérabilités (Trivy), publication dans le registre Nexus
#   3. Deploy        déploiement Kubernetes (cluster kubeadm VMware) après approbation
#   4. Smoke         test de bout en bout à travers l'Ingress
#   5. Monitoring    vérification de la collecte Prometheus et des alertes
#
# Les stages 2 à 5 ne s'exécutent que pour la branche main. Une pull request s'arrête au stage 1.
# Prérequis (voir docs/06-pipeline-azure-devops.md) :
#   pool d'agents      Makzeo-OnPrem         agent auto-hébergé sur le master (outils DevOps)
#   groupe de variables makzeo-secrets       JWT_SECRET, POSTGRES_PASSWORD, ADMIN_PASSWORD,
#                                            NEXUS_CI_PASSWORD, SONAR_TOKEN (secrets)
#   fichier sécurisé   makzeo-kubeconfig     kubeconfig du compte de service ci-deployer
#   environnement      makzeo-onprem         approbation avant déploiement
# =============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include: [main]
  paths:
    exclude: ['docs/**', '**/*.md']

pr:
  branches:
    include: [main]

pool:
  name: Makzeo-OnPrem

variables:
  - group: makzeo-secrets
  # --- Adresses du laboratoire (voir infra/cluster.env) ----------------------
  - name: NEXUS_URL
    value: http://192.168.80.10:8081
  - name: NEXUS_REGISTRY
    value: 192.168.80.10:8083
  - name: NEXUS_CI_USER
    value: ci-deployer
  - name: SONAR_HOST_URL
    value: http://192.168.80.10:9000
  - name: APP_URL
    value: http://makzeo.192.168.80.11.nip.io
  # --- Paramètres du pipeline -------------------------------------------------
  - name: imageTag
    value: $(Build.BuildNumber)
  - name: artifactsDir
    value: $(Pipeline.Workspace)/makzeo-artifacts
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  - name: trivyImage
    value: aquasec/trivy:0.58.1
  - name: sonarMavenPlugin
    value: org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751
  - name: services
    value: auth-service product-service supplier-service stock-service reporting-service

stages:
  # ===========================================================================
  - stage: Build
    displayName: Build, tests et qualité
    jobs:
      # -----------------------------------------------------------------------
      - job: Backend
        displayName: Backend - tests, couverture, SonarQube, Nexus
        timeoutInMinutes: 45
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - script: |
              set -euo pipefail
              rm -rf "$(artifactsDir)" && mkdir -p "$(artifactsDir)"
              java -version
              mvn -version
            displayName: Préparation de l'espace de travail

          - script: |
              set -euo pipefail
              GOAL=verify
              # Sur main, les artefacts testés sont aussi publiés dans Nexus (maven-snapshots)
              if [ "$(isMain)" = "True" ]; then GOAL=deploy; fi
              mvn -B -ntp -s ci/maven-settings.xml -f backend/pom.xml -Pcoverage \
                  clean "${GOAL}" -Dnexus.url="${NEXUS_URL}"
            displayName: Compilation, tests et couverture (mvn verify / deploy)
            env:
              NEXUS_CI_PASSWORD: $(NEXUS_CI_PASSWORD)

          - task: PublishTestResults@2
            displayName: Publication des résultats de tests
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'backend/**/target/surefire-reports/TEST-*.xml'
              testRunTitle: Backend - tests JUnit
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: Publication de la couverture de code
            inputs:
              summaryFileLocation: 'backend/**/target/site/jacoco/jacoco.xml'

          - script: |
              set -euo pipefail
              mvn -B -ntp -s ci/maven-settings.xml -f backend/pom.xml "$(sonarMavenPlugin):sonar" \
                  -Dsonar.host.url="${SONAR_HOST_URL}" \
                  -Dsonar.token="${SONAR_TOKEN}" \
                  -Dsonar.projectKey=makzeo-backend \
                  -Dsonar.projectName="Makzeo - Backend" \
                  -Dsonar.projectVersion="$(imageTag)" \
                  -Dsonar.qualitygate.wait=true \
                  -Dsonar.qualitygate.timeout=300
            displayName: Analyse SonarQube et Quality Gate (backend)
            env:
              NEXUS_CI_PASSWORD: $(NEXUS_CI_PASSWORD)
              SONAR_TOKEN: $(SONAR_TOKEN)

          - script: |
              set -euo pipefail
              for svc in $(services); do
                mkdir -p "$(artifactsDir)/${svc}"
                cp "backend/${svc}/target/${svc}.jar" "$(artifactsDir)/${svc}/app.jar"
              done
              ls -la "$(artifactsDir)"/*
            displayName: Mise de côté des JAR testés pour les images

      # -----------------------------------------------------------------------
      - job: Frontend
        displayName: Frontend - compilation, SonarQube, dépendances
        dependsOn: Backend
        timeoutInMinutes: 30
        steps:
          - checkout: self
            clean: true

          - script: |
              set -euo pipefail
              # Registre npm : proxy Nexus (cache de registry.npmjs.org), authentification du compte CI
              NPMRC="$(Agent.TempDirectory)/.npmrc"
              AUTH="$(printf '%s:%s' "${NEXUS_CI_USER}" "${NEXUS_CI_PASSWORD}" | base64 -w0)"
              {
                echo "registry=${NEXUS_URL}/repository/npm-proxy/"
                echo "//${NEXUS_URL#http://}/repository/npm-proxy/:_auth=${AUTH}"
                echo "always-auth=true"
              } > "${NPMRC}"
              export NPM_CONFIG_USERCONFIG="${NPMRC}"
              node --version
              npm ci --no-audit --no-fund
              npx ng build --configuration production
              rm -f "${NPMRC}"
            workingDirectory: frontend
            displayName: Installation (npm ci via Nexus) et compilation Angular
            env:
              NEXUS_CI_PASSWORD: $(NEXUS_CI_PASSWORD)

          - script: |
              set -euo pipefail
              docker run --rm --network host --user "$(id -u):$(id -g)" \
                -e SONAR_HOST_URL="${SONAR_HOST_URL}" \
                -e SONAR_TOKEN="${SONAR_TOKEN}" \
                -e SONAR_USER_HOME=/usr/src/.sonar \
                -v "$(Build.SourcesDirectory)/frontend:/usr/src" \
                sonarsource/sonar-scanner-cli:latest \
                -Dsonar.projectVersion="$(imageTag)" \
                -Dsonar.qualitygate.wait=true \
                -Dsonar.qualitygate.timeout=300
            displayName: Analyse SonarQube et Quality Gate (frontend)
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)

          - script: |
              set -euo pipefail
              docker run --rm -v "$(Build.SourcesDirectory)/frontend:/src:ro" -v trivy-cache:/root/.cache/ \
                $(trivyImage) fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
                --exit-code 1 --no-progress /src/package-lock.json
            displayName: Analyse des dépendances npm (Trivy)

          - script: |
              set -euo pipefail
              mkdir -p "$(artifactsDir)/frontend"
              cp -r frontend/dist/stock-management-frontend/browser "$(artifactsDir)/frontend/browser"
              cp frontend/nginx.conf frontend/security-headers.conf "$(artifactsDir)/frontend/"
            displayName: Mise de côté de l'interface compilée

      # -----------------------------------------------------------------------
      - job: Manifests
        displayName: Contrôle des manifestes Kubernetes
        dependsOn: Frontend
        steps:
          - checkout: self
            clean: true
          - script: python3 scripts/validate_manifests.py
            displayName: validate_manifests.py (Kustomize, supervision, pipeline)

  # ===========================================================================
  - stage: Images
    displayName: Images Docker -> Nexus
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildScanPush
        displayName: Construction, analyse Trivy, publication
        timeoutInMinutes: 45
        steps:
          - checkout: self
            clean: true

          - script: |
              set -euo pipefail
              echo "${NEXUS_CI_PASSWORD}" | docker login "${NEXUS_REGISTRY}" -u "${NEXUS_CI_USER}" --password-stdin
            displayName: Connexion au registre Nexus
            env:
              NEXUS_CI_PASSWORD: $(NEXUS_CI_PASSWORD)

          - script: |
              set -euo pipefail
              scan() {
                docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/ \
                  $(trivyImage) image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$1"
              }
              build_scan_push() {   # $1 = nom de l'image, $2 = Dockerfile, $3 = contexte, $4 = argument SERVICE
                local repo="${NEXUS_REGISTRY}/makzeo/$1"
                echo "==> ${repo}:$(imageTag)"
                docker build -f "$2" --build-arg SERVICE="$4" --build-arg VERSION="$(imageTag)" \
                  -t "${repo}:$(imageTag)" -t "${repo}:latest" "$3"
                scan "${repo}:$(imageTag)"
                docker push "${repo}:$(imageTag)"
                docker push "${repo}:latest"
              }
              for svc in $(services); do
                build_scan_push "${svc}" backend/Dockerfile.runtime "$(artifactsDir)/${svc}" "${svc}"
              done
              build_scan_push frontend frontend/Dockerfile.runtime "$(artifactsDir)/frontend" frontend
            displayName: Construction, analyse et publication des 6 images

          - script: docker logout "${NEXUS_REGISTRY}"
            displayName: Déconnexion du registre
            condition: always()

          - script: docker image prune -f --filter "until=72h"
            displayName: Nettoyage des images locales
            condition: always()

  # ===========================================================================
  - stage: Deploy
    displayName: Déploiement Kubernetes
    dependsOn: Images
    condition: succeeded()
    jobs:
      - deployment: OnPrem
        displayName: Cluster kubeadm VMware
        environment: makzeo-onprem
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true

                - task: DownloadSecureFile@1
                  name: kubeconfig
                  displayName: Récupération du kubeconfig (compte ci-deployer)
                  inputs:
                    secureFile: makzeo-kubeconfig

                - script: |
                    set -euo pipefail
                    export KUBECONFIG="$(kubeconfig.secureFilePath)"
                    kubectl version
                    kubectl get namespace stock-management

                    echo "==> Secrets (valeurs du groupe makzeo-secrets, jamais stockées dans Git)"
                    kubectl -n stock-management create secret generic stock-secrets \
                      --from-literal=POSTGRES_USER=postgres \
                      --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
                      --from-literal=JWT_SECRET="${JWT_SECRET}" \
                      --from-literal=ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
                      --dry-run=client -o yaml | kubectl apply -f -
                    kubectl -n stock-management create secret docker-registry nexus-registry \
                      --docker-server="${NEXUS_REGISTRY}" \
                      --docker-username="${NEXUS_CI_USER}" \
                      --docker-password="${NEXUS_CI_PASSWORD}" \
                      --dry-run=client -o yaml | kubectl apply -f -

                    echo "==> Images du build $(imageTag)"
                    cd deploy/k8s/overlays/onprem
                    for svc in $(services) frontend; do
                      kustomize edit set image "stock-management/${svc}=${NEXUS_REGISTRY}/makzeo/${svc}:$(imageTag)"
                    done
                    kustomize build . > "$(Build.ArtifactStagingDirectory)/manifests-$(imageTag).yaml"

                    echo "==> Validation par l'API server, puis application"
                    kubectl apply --dry-run=server -f "$(Build.ArtifactStagingDirectory)/manifests-$(imageTag).yaml"
                    kubectl apply -f "$(Build.ArtifactStagingDirectory)/manifests-$(imageTag).yaml"

                    echo "==> Attente des déploiements"
                    kubectl -n stock-management rollout status statefulset/postgres --timeout=300s
                    for d in $(services) frontend; do
                      kubectl -n stock-management rollout status "deployment/${d}" --timeout=420s
                    done
                    kubectl -n stock-management get pods -o wide
                  displayName: Déploiement de la version $(imageTag)
                  env:
                    POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
                    JWT_SECRET: $(JWT_SECRET)
                    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
                    NEXUS_CI_PASSWORD: $(NEXUS_CI_PASSWORD)

                - task: PublishPipelineArtifact@1
                  displayName: Archivage des manifestes appliqués
                  inputs:
                    targetPath: $(Build.ArtifactStagingDirectory)
                    artifact: manifests

  # ===========================================================================
  - stage: Smoke
    displayName: Test de bout en bout
    dependsOn: Deploy
    condition: succeeded()
    jobs:
      - job: E2E
        displayName: Scénario complet via l'Ingress
        steps:
          - checkout: self
            clean: true
          - script: python3 backend/scripts/e2e_test.py --gateway "$(APP_URL)"
            displayName: e2e_test.py sur $(APP_URL)
            env:
              ADMIN_PASSWORD: $(ADMIN_PASSWORD)

  # ===========================================================================
  - stage: Monitoring
    displayName: Vérification de la supervision
    dependsOn: Smoke
    condition: succeeded()
    jobs:
      - job: Prometheus
        displayName: Cibles Prometheus et alertes
        steps:
          - checkout: self
            clean: true
          - task: DownloadSecureFile@1
            name: kubeconfig
            displayName: Récupération du kubeconfig (compte ci-deployer)
            inputs:
              secureFile: makzeo-kubeconfig
          - script: bash ci/scripts/check-prometheus.sh
            displayName: Collecte des métriques et alertes critiques
            env:
              KUBECONFIG: $(kubeconfig.secureFilePath)
