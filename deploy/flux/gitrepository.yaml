# Source GitOps : FluxCD surveille le dépôt (branche main) toutes les minutes
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: stock-management
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/CHANGE_ME/stock-management.git
  ref:
    branch: main
  # Dépôt privé : décommenter et créer le secret (flux create secret git ...)
  # secretRef:
  #   name: stock-management-git
  ignore: |
    # seuls les manifests sont utiles à Flux
    /*
    !/deploy/
