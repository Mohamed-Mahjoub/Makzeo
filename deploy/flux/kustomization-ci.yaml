# Les ressources Tekton (tâches, pipeline, triggers) sont elles aussi gérées en GitOps.
# Pré-requis : Tekton Pipelines et Tekton Triggers installés dans le cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stock-management-ci
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: stock-management
  path: ./deploy/tekton
  prune: true
