# (Optionnel) Notifications de déploiement vers Microsoft Teams / Slack / Discord...
# Créer d'abord le secret contenant l'URL du webhook :
#   kubectl -n flux-system create secret generic flux-webhook --from-literal=address=<url-webhook>
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: team-channel
  namespace: flux-system
spec:
  type: msteams
  secretRef:
    name: flux-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: stock-management-deployments
  namespace: flux-system
spec:
  providerRef:
    name: team-channel
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: stock-management-app
    - kind: GitRepository
      name: stock-management
