# Passerelle locale (docker compose) : interface web + API. En Kubernetes, ce rôle est tenu par l'Ingress.
upstream auth      { server auth-service:8081; }
upstream product   { server product-service:8082; }
upstream supplier  { server supplier-service:8083; }
upstream stock     { server stock-service:8084; }
upstream reporting { server reporting-service:8085; }
upstream procurement { server procurement-service:8086; }
upstream frontend  { server frontend:8080; }

# Protection contre les attaques par force brute : 10 tentatives de connexion par minute et par adresse IP
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 8080;
    client_max_body_size 5m;
    server_tokens off;

    # $http_host conserve le port (localhost:8080) : nécessaire pour que Spring reconnaisse l'origine
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://auth;
    }
    location /api/auth/       { proxy_pass http://auth; }
    location /api/users       { proxy_pass http://auth; }
    location /api/settings    { proxy_pass http://auth; }
    location /api/categories  { proxy_pass http://product; }
    location /api/products    { proxy_pass http://product; }
    location /api/suppliers   { proxy_pass http://supplier; }
    location /api/stock/      { proxy_pass http://stock; }
    location /api/reports/    { proxy_pass http://reporting; }
    location /api/procurement/ { proxy_pass http://procurement; proxy_read_timeout 180s; proxy_send_timeout 180s; }

    # Les points techniques des microservices ne sont pas exposés à l'extérieur
    location /actuator        { return 404; }

    location = /health { access_log off; return 200 "OK\n"; }

    # Interface Angular (toutes les autres routes)
    location /                { proxy_pass http://frontend; }
}
