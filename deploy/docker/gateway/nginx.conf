# Passerelle locale (docker compose) : interface web + API. En Kubernetes, ce rôle est tenu par l'Ingress.
# Résolution DNS dynamique (DNS interne de Docker) : quand un service est recréé avec une nouvelle adresse,
# la passerelle la retrouve sans redémarrage (sinon : 502 Bad Gateway après « docker compose up --build »).
resolver 127.0.0.11 valid=10s ipv6=off;

# Protection contre les attaques par force brute : 10 tentatives de connexion par minute et par adresse IP
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 8080;
    client_max_body_size 5m;
    server_tokens off;

    # $http_host conserve le port (localhost:8080) : nécessaire pour que Spring reconnaisse l'origine
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Services cibles : l'utilisation de variables force la résolution DNS à chaque requête (voir « resolver »)
    set $auth        http://auth-service:8081;
    set $product     http://product-service:8082;
    set $supplier    http://supplier-service:8083;
    set $stock       http://stock-service:8084;
    set $reporting   http://reporting-service:8085;
    set $procurement http://procurement-service:8086;
    set $frontend    http://frontend:8080;

    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $auth;
    }
    location /api/auth/       { proxy_pass $auth; }
    location /api/users       { proxy_pass $auth; }
    location /api/settings    { proxy_pass $auth; }
    location /api/categories  { proxy_pass $product; }
    location /api/products    { proxy_pass $product; }
    location /api/suppliers   { proxy_pass $supplier; }
    location /api/stock/      { proxy_pass $stock; }
    location /api/reports/    { proxy_pass $reporting; }
    location /api/procurement/ { proxy_pass $procurement; proxy_read_timeout 180s; proxy_send_timeout 180s; }

    # Les points techniques des microservices ne sont pas exposés à l'extérieur
    location /actuator        { return 404; }

    location = /health { access_log off; return 200 "OK\n"; }

    # Interface Angular (toutes les autres routes)
    location /                { proxy_pass $frontend; }
}
