# Pipeline CI/CD : tests -> images Docker -> mise à jour GitOps (déploiement par FluxCD)
#
#   fetch-source ─┬─ backend-tests ── build-auth / product / supplier / stock / reporting ─┐
#                 └─ frontend-build ─ build-frontend ─────────────────────────────────────┴─ update-gitops
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: stock-ci-cd
  namespace: stock-ci
spec:
  description: Intégration et livraison continues de l'application Stock Management.
  params:
    - name: repo-url
      type: string
      description: URL HTTPS du dépôt Git (monorepo backend + frontend + manifests)
    - name: revision
      type: string
      default: main
    - name: registry
      type: string
      description: Registre et espace de noms des images (ex. ghcr.io/mon-compte)
    - name: gitops-branch
      type: string
      default: main
  workspaces:
    - name: shared-data
      description: Code source partagé entre les tâches
    - name: docker-credentials
      description: Identifiants du registre (config.json)
    - name: maven-repo
      optional: true
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: shared-data

    - name: backend-tests
      runAfter: ["fetch-source"]
      taskRef:
        name: maven-verify
      workspaces:
        - name: source
          workspace: shared-data
        - name: maven-repo
          workspace: maven-repo

    - name: frontend-build
      runAfter: ["fetch-source"]
      taskRef:
        name: frontend-build
      workspaces:
        - name: source
          workspace: shared-data

    - name: build-auth-service
      runAfter: ["backend-tests"]
      taskRef:
        name: kaniko-build
      params:
        - name: image
          value: $(params.registry)/stock-auth-service:$(tasks.fetch-source.results.short-commit)
        - name: context
          value: backend
        - name: service
          value: auth-service
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: docker-credentials

    - name: build-product-service
      runAfter: ["backend-tests"]
      taskRef:
        name: kaniko-build
      params:
        - name: image
          value: $(params.registry)/stock-product-service:$(tasks.fetch-source.results.short-commit)
        - name: context
          value: backend
        - name: service
          value: product-service
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: docker-credentials

    - name: build-supplier-service
      runAfter: ["backend-tests"]
      taskRef:
        name: kaniko-build
      params:
        - name: image
          value: $(params.registry)/stock-supplier-service:$(tasks.fetch-source.results.short-commit)
        - name: context
          value: backend
        - name: service
          value: supplier-service
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: docker-credentials

    - name: build-stock-service
      runAfter: ["backend-tests"]
      taskRef:
        name: kaniko-build
      params:
        - name: image
          value: $(params.registry)/stock-stock-service:$(tasks.fetch-source.results.short-commit)
        - name: context
          value: backend
        - name: service
          value: stock-service
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: docker-credentials

    - name: build-reporting-service
      runAfter: ["backend-tests"]
      taskRef:
        name: kaniko-build
      params:
        - name: image
          value: $(params.registry)/stock-reporting-service:$(tasks.fetch-source.results.short-commit)
        - name: context
          value: backend
        - name: service
          value: reporting-service
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: docker-credentials

    - name: build-frontend
      runAfter: ["frontend-build"]
      taskRef:
        name: kaniko-build
      params:
        - name: image
          value: $(params.registry)/stock-frontend:$(tasks.fetch-source.results.short-commit)
        - name: context
          value: frontend
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: docker-credentials

    - name: update-gitops
      runAfter: ["build-auth-service", "build-product-service", "build-supplier-service", "build-stock-service", "build-reporting-service", "build-frontend"]
      taskRef:
        name: update-gitops
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: branch
          value: $(params.gitops-branch)
        - name: tag
          value: $(tasks.fetch-source.results.short-commit)
        - name: registry
          value: $(params.registry)
