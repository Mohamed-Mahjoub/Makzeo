# MODÈLES de secrets (NE PAS committer de vraies valeurs). À créer à la main, par exemple :
#
#   kubectl -n stock-ci create secret docker-registry registry-credentials \
#     --docker-server=ghcr.io --docker-username=<utilisateur> --docker-password=<token-registre>
#
#   kubectl -n stock-ci create secret generic git-credentials \
#     --from-literal=username=<utilisateur-git> --from-literal=token=<token-git-avec-droit-push>
#
#   kubectl -n stock-ci create secret generic github-webhook-secret \
#     --from-literal=secretToken=$(openssl rand -hex 20)
#
apiVersion: v1
kind: Secret
metadata:
  name: git-credentials
  namespace: stock-ci
type: Opaque
stringData:
  username: CHANGE_ME
  token: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
  namespace: stock-ci
type: Opaque
stringData:
  secretToken: CHANGE_ME
