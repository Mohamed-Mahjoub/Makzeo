# Ressources Tekton appliquées (manuellement ou par FluxCD) :
#   kubectl apply -k deploy/tekton
# Les secrets (secrets.example.yaml) et le PipelineRun manuel (pipelinerun.yaml) ne sont PAS inclus.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-rbac.yaml
  - tasks/git-clone.yaml
  - tasks/maven-verify.yaml
  - tasks/frontend-build.yaml
  - tasks/kaniko-build.yaml
  - tasks/update-gitops.yaml
  - pipeline.yaml
  - triggers.yaml
