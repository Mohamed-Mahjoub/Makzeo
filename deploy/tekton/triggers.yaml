# Déclenchement automatique du pipeline à chaque push sur la branche main (webhook GitHub)
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push
  namespace: stock-ci
spec:
  params:
    - name: revision
      value: $(body.after)
    - name: repo-url
      value: $(body.repository.clone_url)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: stock-ci-cd
  namespace: stock-ci
spec:
  params:
    - name: revision
    - name: repo-url
    - name: registry
      default: ghcr.io/CHANGE_ME
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: stock-ci-cd-
        namespace: stock-ci
      spec:
        pipelineRef:
          name: stock-ci-cd
        taskRunTemplate:
          serviceAccountName: stock-pipeline
        timeouts:
          pipeline: 1h0m0s
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: revision
            value: $(tt.params.revision)
          - name: registry
            value: $(tt.params.registry)
        workspaces:
          - name: shared-data
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 2Gi
          - name: docker-credentials
            secret:
              secretName: registry-credentials
              items:
                - key: .dockerconfigjson
                  path: config.json
          - name: maven-repo
            persistentVolumeClaim:
              claimName: maven-cache
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: stock-listener
  namespace: stock-ci
spec:
  serviceAccountName: stock-triggers
  triggers:
    - name: github-push-main
      interceptors:
        # Vérifie la signature du webhook GitHub
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        # Uniquement la branche main, et pas les commits du bot GitOps (évite une boucle)
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.ref == 'refs/heads/main' &&
                !body.head_commit.message.contains('[skip ci]')
      bindings:
        - ref: github-push
      template:
        ref: stock-ci-cd
---
# Exposition du webhook (Service "el-stock-listener" créé automatiquement par Tekton Triggers)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stock-listener
  namespace: stock-ci
spec:
  ingressClassName: nginx
  rules:
    - host: tekton-hooks.stock.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: el-stock-listener
                port:
                  number: 8080
