# Espace de noms CI, comptes de service et droits pour Tekton Pipelines / Triggers
apiVersion: v1
kind: Namespace
metadata:
  name: stock-ci
---
# Compte utilisé par les PipelineRuns (accès aux secrets registre / Git)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stock-pipeline
  namespace: stock-ci
secrets:
  - name: registry-credentials
  - name: git-credentials
---
# Compte utilisé par l'EventListener (création des PipelineRuns à la réception d'un webhook)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stock-triggers
  namespace: stock-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stock-triggers-eventlistener
  namespace: stock-ci
subjects:
  - kind: ServiceAccount
    name: stock-triggers
    namespace: stock-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stock-triggers-eventlistener-clusterroles
subjects:
  - kind: ServiceAccount
    name: stock-triggers
    namespace: stock-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
---
# Cache Maven partagé entre les exécutions (accélère les builds)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maven-cache
  namespace: stock-ci
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 3Gi
