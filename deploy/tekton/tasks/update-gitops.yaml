apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: update-gitops
  namespace: stock-ci
spec:
  description: >-
    Met à jour les tags d'images de l'overlay Kustomize de production et pousse le commit
    dans le dépôt Git : FluxCD détecte le changement et déploie (GitOps).
  params:
    - name: repo-url
      type: string
    - name: branch
      type: string
      default: main
    - name: tag
      type: string
    - name: registry
      type: string
    - name: overlay
      type: string
      default: deploy/k8s/overlays/prod/kustomization.yaml
  steps:
    - name: bump-image-tags
      image: alpine/git:latest
      env:
        - name: GIT_USERNAME
          valueFrom:
            secretKeyRef:
              name: git-credentials
              key: username
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: git-credentials
              key: token
      script: |
        #!/bin/sh
        set -eu
        URL="$(params.repo-url)"
        git clone --quiet --branch "$(params.branch)" "https://${GIT_USERNAME}:${GIT_TOKEN}@${URL#https://}" /tmp/gitops
        cd /tmp/gitops
        FILE="$(params.overlay)"
        # Registre et tag de chaque image
        sed -i -E "s#(newName: ).*/(stock-[a-z-]+)#\1$(params.registry)/\2#" "$FILE"
        sed -i -E "s#(newTag: ).*#\1\"$(params.tag)\"#" "$FILE"
        git diff --stat
        if git diff --quiet; then
          echo "Aucune modification : les images sont déjà à jour."
          exit 0
        fi
        git -c user.name="tekton-bot" -c user.email="tekton-bot@stock.local" \
          commit -am "chore(deploy): images $(params.tag) [skip ci]"
        git push --quiet origin "HEAD:$(params.branch)"
        echo "Overlay de production mis à jour avec le tag $(params.tag)"
