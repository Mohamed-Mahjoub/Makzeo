apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kaniko-build
  namespace: stock-ci
spec:
  description: >-
    Construit une image Docker sans démon Docker (Kaniko) à partir d'un Dockerfile
    et la pousse dans le registre.
  params:
    - name: image
      type: string
      description: Référence complète de l'image (registre/nom:tag)
    - name: context
      type: string
      description: Dossier de contexte, relatif au workspace source
    - name: dockerfile
      type: string
      default: Dockerfile
    - name: service
      type: string
      default: ""
      description: Valeur de l'argument de build SERVICE (microservices backend)
  results:
    - name: IMAGE_DIGEST
      description: Empreinte (digest) de l'image poussée
  workspaces:
    - name: source
    - name: dockerconfig
      description: Secret contenant config.json (identifiants du registre)
      mountPath: /kaniko/.docker
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2
      args:
        - --dockerfile=$(workspaces.source.path)/$(params.context)/$(params.dockerfile)
        - --context=dir://$(workspaces.source.path)/$(params.context)
        - --destination=$(params.image)
        - --build-arg=SERVICE=$(params.service)
        - --digest-file=$(results.IMAGE_DIGEST.path)
        - --snapshot-mode=redo
        - --use-new-run
      computeResources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 3Gi
