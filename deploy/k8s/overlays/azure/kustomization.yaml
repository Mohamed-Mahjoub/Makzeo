# Overlay Azure (AKS + Azure Container Registry), utilisé par azure-pipelines.yml.
#
# A ADAPTER une seule fois :
#   - makzeoacr.azurecr.io       -> le "login server" de votre registre ACR
#   - makzeo.20.0.0.1.nip.io     -> makzeo.<IP publique de l'ingress>.nip.io (ou votre domaine)
#
# Le pipeline remplace les tags "latest" par le numéro du build (kustomize edit set image).
# Le Secret stock-secrets n'est PAS dans Git : le pipeline le crée à partir du groupe de
# variables Azure DevOps "makzeo-secrets".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stock-management
resources:
  - ../../base
labels:
  - pairs:
      environment: azure
    includeSelectors: false

images:
  - name: stock-management/auth-service
    newName: makzeoacr.azurecr.io/stock-auth-service
    newTag: latest
  - name: stock-management/product-service
    newName: makzeoacr.azurecr.io/stock-product-service
    newTag: latest
  - name: stock-management/supplier-service
    newName: makzeoacr.azurecr.io/stock-supplier-service
    newTag: latest
  - name: stock-management/stock-service
    newName: makzeoacr.azurecr.io/stock-stock-service
    newTag: latest
  - name: stock-management/reporting-service
    newName: makzeoacr.azurecr.io/stock-reporting-service
    newTag: latest
  - name: stock-management/frontend
    newName: makzeoacr.azurecr.io/stock-frontend
    newTag: latest

patches:
  # Nom d'hôte public de l'application
  - target:
      kind: Ingress
      name: stock-management
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: makzeo.20.0.0.1.nip.io
  # Origine autorisée par CORS = même adresse que l'Ingress
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: http://makzeo.20.0.0.1.nip.io
