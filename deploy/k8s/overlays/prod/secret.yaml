# Secret de production.
# À CHIFFRER avant tout commit (FluxCD le déchiffre avec la clé age du cluster) :
#   sops --encrypt --in-place deploy/k8s/overlays/prod/secret.yaml
# (règles de chiffrement : fichier .sops.yaml à la racine du dépôt)
apiVersion: v1
kind: Secret
metadata:
  name: stock-secrets
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: CHANGE_ME_strong_db_password
  JWT_SECRET: CHANGE_ME_generate_with_openssl_rand_base64_48
  ADMIN_PASSWORD: CHANGE_ME_admin_password
