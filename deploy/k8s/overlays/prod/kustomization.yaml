# Environnement de production — synchronisé par FluxCD (GitOps)
# Les tags d'images (newTag) sont mis à jour automatiquement par le pipeline Tekton.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stock-management
resources:
  - ../../base
  - secret.yaml
  - hpa.yaml
  - pdb.yaml
labels:
  - pairs:
      environment: prod
    includeSelectors: false

images:
  - name: stock-management/auth-service
    newName: ghcr.io/CHANGE_ME/stock-auth-service
    newTag: "latest"
  - name: stock-management/product-service
    newName: ghcr.io/CHANGE_ME/stock-product-service
    newTag: "latest"
  - name: stock-management/supplier-service
    newName: ghcr.io/CHANGE_ME/stock-supplier-service
    newTag: "latest"
  - name: stock-management/stock-service
    newName: ghcr.io/CHANGE_ME/stock-stock-service
    newTag: "latest"
  - name: stock-management/reporting-service
    newName: ghcr.io/CHANGE_ME/stock-reporting-service
    newTag: "latest"
  - name: stock-management/frontend
    newName: ghcr.io/CHANGE_ME/stock-frontend
    newTag: "latest"

# Nombre de réplicas : piloté par les HorizontalPodAutoscaler (hpa.yaml), pas fixé ici
# pour éviter un conflit entre FluxCD et l'autoscaler.

patches:
  # Nom de domaine public + TLS (cert-manager)
  - target:
      kind: Ingress
      name: stock-management
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: stock.example.com
      - op: add
        path: /spec/tls
        value:
          - hosts: ["stock.example.com"]
            secretName: stock-management-tls
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: https://stock.example.com
  # Images tirées depuis le registre à chaque déploiement
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component in (backend,frontend)
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
