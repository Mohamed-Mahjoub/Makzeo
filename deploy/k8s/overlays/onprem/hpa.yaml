# Mise à l'échelle automatique selon la charge CPU (nécessite metrics-server, installé avec le cluster)
# minReplicas 1 : le laboratoire tourne sur un PC de 16 Go ; la charge ajoute des pods jusqu'à maxReplicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
