# Collecte des métriques des 5 microservices par Prometheus (opérateur kube-prometheus-stack)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: makzeo-backend
  labels:
    app.kubernetes.io/name: makzeo-backend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  namespaceSelector:
    matchNames:
      - stock-management
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
