# Règles d'alerte de l'application, évaluées par Prometheus et envoyées à Alertmanager
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: makzeo-alerts
spec:
  groups:
    - name: makzeo.availability
      rules:
        - alert: MakzeoServiceDown
          expr: up{namespace="stock-management", job=~".*-service"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Le service {{ $labels.job }} ne répond plus"
            description: "Prometheus n'arrive plus à collecter les métriques de {{ $labels.pod }} depuis 2 minutes."
        - alert: MakzeoPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="stock-management"}[15m]) > 3
          labels:
            severity: warning
          annotations:
            summary: "Redémarrages répétés du pod {{ $labels.pod }}"
            description: "Plus de 3 redémarrages en 15 minutes : consulter kubectl logs --previous."
    - name: makzeo.performance
      rules:
        - alert: MakzeoHighErrorRate
          expr: |
            sum by (job) (rate(http_server_requests_seconds_count{namespace="stock-management", status=~"5.."}[5m]))
              / sum by (job) (rate(http_server_requests_seconds_count{namespace="stock-management"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Taux d'erreurs serveur élevé sur {{ $labels.job }}"
            description: "Plus de 5 % des requêtes renvoient une erreur 5xx depuis 5 minutes."
        - alert: MakzeoHighLatency
          expr: |
            histogram_quantile(0.95, sum by (job, le) (rate(http_server_requests_seconds_bucket{namespace="stock-management"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Temps de réponse élevé sur {{ $labels.job }}"
            description: "Le 95e percentile du temps de réponse dépasse 1 seconde depuis 10 minutes."
        - alert: MakzeoJvmHeapHigh
          expr: |
            sum by (job, pod) (jvm_memory_used_bytes{namespace="stock-management", area="heap"})
              / sum by (job, pod) (jvm_memory_max_bytes{namespace="stock-management", area="heap"} > 0) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Mémoire JVM presque saturée sur {{ $labels.pod }}"
            description: "Le tas Java est utilisé à plus de 90 % depuis 10 minutes."
    - name: makzeo-procurement
      rules:
        - alert: MakzeoProcurementWatchFailed
          expr: |
            sum(increase(makzeo_procurement_watch_runs_total{namespace="stock-management", status="failed"}[1d])) > 0
          labels:
            severity: warning
          annotations:
            summary: "La veille fournisseurs mensuelle a échoué"
            description: "Au moins une exécution de la veille IA a échoué ces dernières 24 heures (voir /achats et les journaux de procurement-service)."
        - alert: MakzeoProcurementAiErrors
          expr: |
            sum(increase(makzeo_procurement_ai_call_seconds_count{namespace="stock-management", outcome="error"}[1h])) > 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Erreurs répétées du moteur IA (API Claude)"
            description: "Plus de 5 appels à l'API Claude en erreur sur la dernière heure : vérifier AI_API_KEY, le quota et l'accès réseau sortant."
