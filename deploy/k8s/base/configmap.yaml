# Configuration non sensible partagée par les microservices
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  CORS_ALLOWED_ORIGINS: "http://stock.local"
  APP_ZONE: Africa/Casablanca
  # Swagger UI et /v3/api-docs désactivés dans le cluster (activables pour une démonstration)
  SWAGGER_ENABLED: "false"
  # Découverte de services : DNS interne Kubernetes (nom du Service)
  SUPPLIER_SERVICE_URL: http://supplier-service:8083
  PRODUCT_SERVICE_URL: http://product-service:8082
  STOCK_SERVICE_URL: http://stock-service:8084
  AUTH_SERVICE_URL: http://auth-service:8081
  # Module IA achats
  PROCUREMENT_ZONE: Africa/Tunis
  APP_URL: "http://stock.local"
  PROCUREMENT_BUYER_EMAIL: achats@makzeo.local
  PROCUREMENT_MANAGER_EMAILS: responsable.achats@makzeo.local
  # Serveur SMTP : Mailpit (démonstration) ; à remplacer par le serveur de l'entreprise
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
