# Environnement local complet : PostgreSQL + 6 microservices + frontend Angular + passerelle Nginx + Mailpit
#   Application : http://localhost:8080
#   Courriels envoyés (demandes de prix, alertes) : http://localhost:8025
#   cp .env.example .env && docker compose up -d --build
name: stock-management

x-service-env: &service-env
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire (voir .env.example)}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:4200}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire (voir .env.example)}

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire (voir .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: { context: ./backend, args: { SERVICE: auth-service } }
    image: stock-management/auth-service:latest
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_NAME: auth_db
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD est obligatoire (voir .env.example)}
    ports: ["8081:8081"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/8081' || exit 1"]

  product-service:
    build: { context: ./backend, args: { SERVICE: product-service } }
    image: stock-management/product-service:latest
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_NAME: product_db
      SUPPLIER_SERVICE_URL: http://supplier-service:8083
    ports: ["8082:8082"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/8082' || exit 1"]

  supplier-service:
    build: { context: ./backend, args: { SERVICE: supplier-service } }
    image: stock-management/supplier-service:latest
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_NAME: supplier_db
    ports: ["8083:8083"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/8083' || exit 1"]

  stock-service:
    build: { context: ./backend, args: { SERVICE: stock-service } }
    image: stock-management/stock-service:latest
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_NAME: stock_db
      PRODUCT_SERVICE_URL: http://product-service:8082
    ports: ["8084:8084"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/8084' || exit 1"]

  reporting-service:
    build: { context: ./backend, args: { SERVICE: reporting-service } }
    image: stock-management/reporting-service:latest
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:4200}
      PRODUCT_SERVICE_URL: http://product-service:8082
      STOCK_SERVICE_URL: http://stock-service:8084
      AUTH_SERVICE_URL: http://auth-service:8081
    ports: ["8085:8085"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/8085' || exit 1"]

  # Crée la base du module achats sur un volume PostgreSQL déjà initialisé (sans effet si elle existe)
  procurement-db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire (voir .env.example)}
    command: >-
      sh -c "psql -h postgres -U postgres -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='procurement_db'\" | grep -q 1
      || psql -h postgres -U postgres -d postgres -c 'CREATE DATABASE procurement_db'"
    depends_on:
      postgres: { condition: service_healthy }

  procurement-service:
    build: { context: ./backend, args: { SERVICE: procurement-service } }
    image: stock-management/procurement-service:latest
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_NAME: procurement_db
      PRODUCT_SERVICE_URL: http://product-service:8082
      SUPPLIER_SERVICE_URL: http://supplier-service:8083
      STOCK_SERVICE_URL: http://stock-service:8084
      APP_URL: http://localhost:8080
      # Agent IA (facultatif) : sans clé, la veille web est désactivée
      AI_API_KEY: ${AI_API_KEY:-}
      # Serveur SMTP : Mailpit en local (aucun courriel ne sort réellement)
      SPRING_MAIL_HOST: ${SMTP_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SMTP_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      PROCUREMENT_BUYER_EMAIL: ${PROCUREMENT_BUYER_EMAIL:-achats@makzeo.local}
      PROCUREMENT_MANAGER_EMAILS: ${PROCUREMENT_MANAGER_EMAILS:-responsable.achats@makzeo.local}
    ports: ["8086:8086"]
    depends_on:
      procurement-db-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/8086' || exit 1"]

  # Serveur SMTP de démonstration : capture les courriels, consultables sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  frontend:
    build: { context: ./frontend }
    image: stock-management/frontend:latest
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:8080"]
    # la passerelle ne démarre qu'une fois les 6 services prêts (sinon 502 / arrêt de Nginx)
    depends_on:
      auth-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      supplier-service: { condition: service_healthy }
      stock-service: { condition: service_healthy }
      reporting-service: { condition: service_healthy }
      procurement-service: { condition: service_healthy }
      frontend: { condition: service_started }

volumes:
  pgdata:
