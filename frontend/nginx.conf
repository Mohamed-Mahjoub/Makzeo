# Serveur de l'interface Angular (image non-root, port 8080).
# Les appels /api/** sont routés par l'Ingress Kubernetes, ou par la passerelle nginx en local.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fichiers avec empreinte dans leur nom : mise en cache longue
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "OK\n";
    }

    # Application monopage : toute route inconnue renvoie index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
