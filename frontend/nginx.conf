# Serveur du frontend Angular (image non-root, port 8080).
# Les appels /api/** sont routés par l'Ingress Kubernetes (ou la passerelle Nginx en docker compose).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fichiers générés avec empreinte : cache long
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "OK\n";
    }

    # Application monopage : toute route inconnue renvoie index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
