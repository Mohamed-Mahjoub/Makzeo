server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: stock-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stock_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    locale: fr
    locale-resolver: fixed
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  zone: ${APP_ZONE:Africa/Casablanca}
  openapi:
    description: "Entrées / sorties, niveaux de stock, historique, inventaires et alertes (rupture, seuil minimum)."

# Documentation OpenAPI 3 / Swagger UI (springdoc)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    display-request-duration: true
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'
