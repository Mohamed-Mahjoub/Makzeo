server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:product_db}
    username: ${DB_USER:postgres}
    # aucun mot de passe par défaut : DB_PASSWORD est obligatoire
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    locale: fr
    locale-resolver: fixed
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  security:
    # aucune clé par défaut : JWT_SECRET est obligatoire (32 caractères minimum, identique pour les 5 services)
    jwt-secret: ${JWT_SECRET}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  services:
    supplier-url: ${SUPPLIER_SERVICE_URL:http://localhost:8083}
    supplier-check-enabled: ${SUPPLIER_CHECK_ENABLED:true}
  openapi:
    description: "Catalogue : produits, catégories, références et codes-barres (EAN-13)."

# Documentation OpenAPI 3 / Swagger UI (springdoc)
springdoc:
  api-docs:
    # désactivé en production (SWAGGER_ENABLED=false dans Kubernetes)
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    display-request-duration: true
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'
