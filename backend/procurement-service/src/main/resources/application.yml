server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

spring:
  application:
    name: procurement-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:procurement_db}
    username: ${DB_USER:postgres}
    # aucun mot de passe par défaut : DB_PASSWORD est obligatoire
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  # Serveur SMTP : défini uniquement par variables d'environnement
  # (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD).
  # Sans SPRING_MAIL_HOST, aucun courriel ne part (les demandes de prix passent en échec d'envoi).
  mail:
    default-encoding: UTF-8
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  web:
    locale: fr
    locale-resolver: fixed
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  security:
    # aucune clé par défaut : JWT_SECRET est obligatoire (32 caractères minimum, identique pour tous les services)
    jwt-secret: ${JWT_SECRET}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  procurement:
    product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    supplier-service-url: ${SUPPLIER_SERVICE_URL:http://localhost:8083}
    stock-service-url: ${STOCK_SERVICE_URL:http://localhost:8084}
    zone: ${APP_ZONE:Africa/Tunis}
    currency: ${PROCUREMENT_CURRENCY:TND}
    market-country: ${PROCUREMENT_MARKET_COUNTRY:TN}
    market-name: ${PROCUREMENT_MARKET_NAME:Tunisie}
    vat-rate-pct: ${PROCUREMENT_VAT_RATE_PCT:19}
    watch-enabled: ${PROCUREMENT_WATCH_ENABLED:true}
    watch-cron: ${PROCUREMENT_WATCH_CRON:0 30 6 1 * *}
    max-products-per-run: ${PROCUREMENT_MAX_PRODUCTS:25}
    max-suppliers-per-product: ${PROCUREMENT_MAX_SUPPLIERS:5}
    max-rfqs-per-product: ${PROCUREMENT_MAX_RFQS:3}
    forecast-horizon-months: ${PROCUREMENT_FORECAST_MONTHS:3}
    annual-inflation-pct: ${PROCUREMENT_INFLATION_PCT:5.5}
    monthly-holding-rate: ${PROCUREMENT_HOLDING_RATE:0.015}
    purchase-budget: ${PROCUREMENT_BUDGET:}
    buyer-company: ${PROCUREMENT_BUYER_COMPANY:Makzeo}
    buyer-email: ${PROCUREMENT_BUYER_EMAIL:achats@makzeo.local}
    purchasing-manager-emails: ${PROCUREMENT_MANAGER_EMAILS:}
    app-url: ${APP_URL:http://localhost:8080}
  ai:
    # clé de l'API Claude : secret injecté par variable d'environnement, jamais dans le code
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:claude-sonnet-5}
    max-searches-per-call: ${AI_MAX_SEARCHES:5}
  websearch:
    # Veille web sans modèle de langage, utilisée quand AI_API_KEY est vide :
    # Serper (résultats Google) trouve les fournisseurs, Tavily lit leurs pages. Secrets fournis par l'environnement.
    serper-api-key: ${SERPER_API_KEY:}
    tavily-api-key: ${TAVILY_API_KEY:}
    max-pages-per-product: ${WEBSEARCH_MAX_PAGES:5}
  openapi:
    description: "Module IA achats : veille fournisseurs, demandes de prix, comparaison des devis, prédiction des prix et achats anticipés."

# Documentation OpenAPI 3 / Swagger UI (springdoc)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    display-request-duration: true
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # l'état du serveur SMTP ne doit pas rendre le service indisponible
    mail:
      enabled: false
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'
