# =============================================================================
# Outils de la chaîne DevOps, hébergés sur la VM "devops" (Docker Compose) :
#   SonarQube  http://<IP devops>:9000   analyse de la qualité du code
#   Nexus      http://<IP devops>:8081   dépôt Maven, proxy npm, registre Docker (port 8083)
#   cp .env.example .env  &&  docker compose up -d
# =============================================================================
name: devops-tools

services:
  sonar-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD est obligatoire (voir .env.example)}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    ulimits:
      nofile:
        soft: 131072
        hard: 131072

  nexus:
    image: sonatype/nexus3:latest
    restart: unless-stopped
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g"
    volumes:
      - nexus_data:/nexus-data
    ports:
      - "8081:8081"   # interface web, API, dépôts Maven et npm
      - "8083:8083"   # registre Docker hébergé (docker-hosted)

volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  nexus_data:
